name: Build firmware and publish web flasher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install PlatformIO
        run: pip install platformio

      - name: Build repeater C3
        run: pio run -e seeed_xiao_esp32c3
      - name: Build repeater S2
        run: pio run -e adafruit_feather_esp32s2
      - name: Build Heltec V3 messenger
        run: pio run -e heltec_wifi_lora_32_V3
      - name: Build home DX-LR20 messenger
        run: pio run -e home_xiao_esp32c3

      - name: Copy flash parts into website
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p web/firmware/c3 web/firmware/s2 web/firmware/heltec web/firmware/home

          cp .pio/build/seeed_xiao_esp32c3/bootloader.bin web/firmware/c3/bootloader.bin
          cp .pio/build/seeed_xiao_esp32c3/partitions.bin web/firmware/c3/partitions.bin
          cp .pio/build/seeed_xiao_esp32c3/firmware.bin web/firmware/c3/firmware.bin

          # PlatformIO's Adafruit S2 build does not always emit a standalone
          # bootloader.bin. Keep Pages deploys working when it is absent.
          if [ -f .pio/build/adafruit_feather_esp32s2/bootloader.bin ]; then
            cp .pio/build/adafruit_feather_esp32s2/bootloader.bin web/firmware/s2/bootloader.bin
          fi
          cp .pio/build/adafruit_feather_esp32s2/partitions.bin web/firmware/s2/partitions.bin
          cp .pio/build/adafruit_feather_esp32s2/firmware.bin web/firmware/s2/firmware.bin

          cp .pio/build/heltec_wifi_lora_32_V3/bootloader.bin web/firmware/heltec/bootloader.bin
          cp .pio/build/heltec_wifi_lora_32_V3/partitions.bin web/firmware/heltec/partitions.bin
          cp .pio/build/heltec_wifi_lora_32_V3/firmware.bin web/firmware/heltec/firmware.bin

          cp .pio/build/home_xiao_esp32c3/bootloader.bin web/firmware/home/bootloader.bin
          cp .pio/build/home_xiao_esp32c3/partitions.bin web/firmware/home/partitions.bin
          cp .pio/build/home_xiao_esp32c3/firmware.bin web/firmware/home/firmware.bin

          BOOT_APP0=$(find "$HOME/.platformio" -path '*/framework-arduinoespressif32/tools/partitions/boot_app0.bin' | head -n 1)
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" web/firmware/c3/boot_app0.bin
          cp "$BOOT_APP0" web/firmware/s2/boot_app0.bin
          cp "$BOOT_APP0" web/firmware/heltec/boot_app0.bin
          cp "$BOOT_APP0" web/firmware/home/boot_app0.bin

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
