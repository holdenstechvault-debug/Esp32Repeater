name: Build firmware and publish web flasher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build XIAO ESP32-C3 firmware
        run: pio run -e seeed_xiao_esp32c3
      - name: Copy flash parts into website
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p web/firmware
          cp .pio/build/seeed_xiao_esp32c3/bootloader.bin web/firmware/bootloader.bin
          cp .pio/build/seeed_xiao_esp32c3/partitions.bin web/firmware/partitions.bin
          cp .pio/build/seeed_xiao_esp32c3/firmware.bin web/firmware/firmware.bin
          BOOT_APP0=$(find "$HOME/.platformio" -name boot_app0.bin | head -n 1)
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" web/firmware/boot_app0.bin
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
